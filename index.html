<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Qupos - Minutas</title>
  <link rel="icon" href="https://www.qupos.com/assets/qupos-logo-O7Yzz17d.png" type="image/png" />
  <link rel="preload"
    href="https://nlxfcqyqzaigdohkvpmf.supabase.co/storage/v1/object/public/avatars/Logos%20adicionales/lite.png"
    as="image" />
  <link rel="preload" href="https://www.qupos.com/assets/qupos-logo-O7Yzz17d.png" as="image" />
  <link rel="preload"
    href="https://nlxfcqyqzaigdohkvpmf.supabase.co/storage/v1/object/public/avatars/Logos%20adicionales/erp.png"
    as="image" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="index.html">
        <img src="https://www.qupos.com/assets/qupos-logo-O7Yzz17d.png" alt="Qupos">
        <div class="brand-copy">
          <div class="t">Centro de trabajo Implantaciones</div>
          <div class="s">Accesos internos</div>
        </div>
      </a>
      <div class="topbar-main">
        <div class="navlinks" aria-label="Navegación principal">
          <a class="navlink active" href="index.html">Minutas</a>
          <a class="navlink" href="Guia_Gmail_HubSpot.html">Guía</a>
        </div>
      </div>
    </div>
  </div>

  <div class="wrap">

    <div class="panel">

      <div class="tabs" role="tablist" aria-label="Tipos de correo">
        <button class="tab active" id="tabInstalacion" type="button" data-tab="instalacion">Instalación</button>
        <button class="tab" id="tabMigracion" type="button" data-tab="migracion">Migración</button>
        <button class="tab" id="tabCapacitacion" type="button" data-tab="capacitacion">Capacitación</button>
        <button class="tab" id="tabPuestaEnMarcha" type="button" data-tab="puestaEnMarcha">Puesta en Marcha</button>
      </div>

      <h1>Datos del correo</h1>

      <div class="row">
        <div>
          <label>País</label>
          <select id="country">
            <option value="CR" selected>Costa Rica</option>
            <option value="RD">República Dominicana</option>
          </select>
        </div>
        <div>
          <label>Asunto</label>
          <input id="subject" value="Minuta Razón Comercial Instalación">
        </div>
      </div>

      <hr class="hr">
      <h2>Campos obligatorios</h2>

      <div class="row">
        <div>
          <label>Fecha</label>
          <input type="date" id="installDate">
        </div>
        <div>
          <label>Implantador NCQ</label>
          <select id="implanterNCQ">
            <!-- Carga dinámica desde JS -->
          </select>
        </div>
      </div>

      <div class="row">
        <div>
          <label>Razón comercial</label>
          <input id="clientName" placeholder="Razón Comercial">
        </div>
        <div>
          <label>Cliente a cargo</label>
          <input id="clientContact" placeholder="Nombre de la persona en la empresa">
        </div>
      </div>

      <div>
        <label>Licencia Qupos</label>
        <select id="quposVersion">
          <option value="Lite">Lite</option>
          <option value="Standard" selected>Standard</option>
          <option value="ERP">ERP</option>
        </select>
      </div>

      <div id="sectionInstalacion">
        <hr class="hr">
        <div class="row">
          <div>
            <label>Sistema anterior (Migración)</label>
            <input id="prevSystem" placeholder="Ej: Logosoft">
          </div>
          <div>
            <label>Cantidad de Licencias</label>
            <input type="number" id="licenseCount" value="1">
          </div>
        </div>

        <label>Correo Respaldos (Cloud)</label>
        <input id="backupEmail" placeholder="ejemplocorreo@gmail.com">

        <label>Pendientes Cliente</label>
        <textarea id="clientPendings" placeholder="Lista de tareas del cliente..."></textarea>

        <label>Pendientes NCQ</label>
        <textarea id="ncqPendings" placeholder="Lista de tareas nuestras..."></textarea>
      </div>

      <div id="sectionMigracion" class="hidden">
        <hr class="hr">
        <label>Sistema anterior (Migración)</label>
        <input id="prevSystemMigracion" placeholder="Ej: Logosoft">

        <label>Incluir en Trabajo Realizado:</label>
        <div style="display: grid; grid-template-columns: 1fr; gap: 8px; margin-bottom: 12px;">
          <label
            style="display: flex; align-items: center; gap: 8px; margin: 0; cursor: pointer; color: var(--text); font-size: 14px;">
            <input type="checkbox" id="checkMigracionArticulos">
            Artículos
          </label>
          <label
            style="display: flex; align-items: center; gap: 8px; margin: 0; cursor: pointer; color: var(--text); font-size: 14px;">
            <input type="checkbox" id="checkMigracionClientes">
            Clientes
          </label>
          <label
            style="display: flex; align-items: center; gap: 8px; margin: 0; cursor: pointer; color: var(--text); font-size: 14px;">
            <input type="checkbox" id="checkMigracionProveedores">
            Proveedores
          </label>
          <label
            style="display: flex; align-items: center; gap: 8px; margin: 0; cursor: pointer; color: var(--text); font-size: 14px;">
            <input type="checkbox" id="checkMigracionCuentasPorCobrar">
            Cuentas por cobrar
          </label>
          <div id="divDateCxC" class="hidden" style="margin-left: 24px;">
            <label>Fecha corte Cuentas por cobrar</label>
            <input type="date" id="dateMigracionCxC">
          </div>
          <label
            style="display: flex; align-items: center; gap: 8px; margin: 0; cursor: pointer; color: var(--text); font-size: 14px;">
            <input type="checkbox" id="checkMigracionCuentasPorPagar">
            Cuentas por pagar
          </label>
          <div id="divDateCxP" class="hidden" style="margin-left: 24px;">
            <label>Fecha corte Cuentas por pagar</label>
            <input type="date" id="dateMigracionCxP">
          </div>
        </div>

        <label>Pendientes NCQ</label>
        <textarea id="ncqPendingsMigracion" placeholder="Detalle de correcciones de datos..."></textarea>
      </div>

      <div id="sectionCapacitacion" class="hidden">
        <hr class="hr">

        <div style="display: flex; align-items: center; justify-content: space-between; margin: 10px 0 6px;">
          <label style="margin: 0; font-weight: bold; color: var(--text);">Tema de Capacitación</label>
          <label style="display: flex; align-items: center; gap: 6px; margin: 0; font-weight: bold; cursor: pointer; color: var(--qupos-dark); font-size: 13px;">
            <input type="checkbox" id="isMultiTopic" style="margin:0;"> Multi-tema
          </label>
        </div>

        <div id="singleTopicContainer">
          <select id="capacitacionTopic">
            <option value="Compras">Compras</option>
            <option value="Inventarios - CxP">Inventarios - CxP</option>
            <option value="Facturación - CxC">Facturación - CxC</option>
            <option value="Ofertas - Promociones">Ofertas - Promociones</option>
            <option value="CxP">CxP</option>
            <option value="Rutas">Rutas</option>
            <option value="Liquidaciones">Liquidaciones</option>
            <option value="Handheld">Handheld</option>
            <option value="Reporteria (Lite/Estandar)">Reporteria (Lite/Estandar)</option>
            <option value="Reporteria (Rutas)">Reporteria (Rutas)</option>
            <option value="PinPads">PinPads</option>
          </select>
        </div>

        <div id="multiTopicContainer" class="hidden" style="border: 1px solid var(--border); border-radius: 10px; padding: 12px; background: #f8fafc; margin-bottom: 12px;">
          <label style="margin: 0 0 8px; font-weight: 700; color: #475569;">Seleccione los temas dictados:</label>
          <div style="display: grid; grid-template-columns: 1fr; gap: 8px;">
            <!-- Generado dinámicamente -->
          </div>
        </div>

        <div class="row">
          <div>
            <label>Hora de Inicio</label>
            <div style="display: flex; gap: 6px;">
              <select id="startTimeHourCapacitacion" style="width: 50%;">
                <option value="00">00</option>
                <option value="01">01</option>
                <option value="02">02</option>
                <option value="03">03</option>
                <option value="04">04</option>
                <option value="05">05</option>
                <option value="06">06</option>
                <option value="07">07</option>
                <option value="08">08</option>
                <option value="09" selected>09</option>
                <option value="10">10</option>
                <option value="11">11</option>
                <option value="12">12</option>
                <option value="13">13</option>
                <option value="14">14</option>
                <option value="15">15</option>
                <option value="16">16</option>
                <option value="17">17</option>
                <option value="18">18</option>
                <option value="19">19</option>
                <option value="20">20</option>
                <option value="21">21</option>
                <option value="22">22</option>
                <option value="23">23</option>
              </select>
              <select id="startTimeMinCapacitacion" style="width: 50%;">
                <option value="00" selected>00</option>
                <option value="15">15</option>
                <option value="30">30</option>
                <option value="45">45</option>
              </select>
            </div>
          </div>
          <div>
            <label>Hora de Finalización</label>
            <div style="display: flex; gap: 6px;">
              <select id="endTimeHourCapacitacion" style="width: 50%;">
                <option value="00">00</option>
                <option value="01">01</option>
                <option value="02">02</option>
                <option value="03">03</option>
                <option value="04">04</option>
                <option value="05">05</option>
                <option value="06">06</option>
                <option value="07">07</option>
                <option value="08">08</option>
                <option value="09">09</option>
                <option value="10">10</option>
                <option value="11" selected>11</option>
                <option value="12">12</option>
                <option value="13">13</option>
                <option value="14">14</option>
                <option value="15">15</option>
                <option value="16">16</option>
                <option value="17">17</option>
                <option value="18">18</option>
                <option value="19">19</option>
                <option value="20">20</option>
                <option value="21">21</option>
                <option value="22">22</option>
                <option value="23">23</option>
              </select>
              <select id="endTimeMinCapacitacion" style="width: 50%;">
                <option value="00" selected>00</option>
                <option value="15">15</option>
                <option value="30">30</option>
                <option value="45">45</option>
              </select>
            </div>
          </div>
        </div>

        <label>Asistentes (uno por línea)</label>
        <textarea id="clientContactCapacitacion" placeholder="Nombre de los asistentes..."
          style="min-height: 100px;"></textarea>

        <hr class="hr">

        <label>Contenidos cubiertos:</label>
        <div id="capacitacionCheckboxes"
          style="display: grid; grid-template-columns: 1fr; gap: 8px; margin-bottom: 12px;">
          <!-- Se genera dinámicamente -->
        </div>

        <div id="divPinPadsExtra" class="hidden" style="margin-top: 10px; margin-bottom: 10px;">
          <div class="row">
            <div>
              <label>Cantidad de PinPads</label>
              <input type="number" id="pinpadCount" value="1" min="1">
            </div>
            <div>
              <label>Cantidad de Terminales</label>
              <input type="number" id="terminalCount" value="1" min="1">
            </div>
          </div>
        </div>

        <label>Pendientes Cliente</label>
        <textarea id="clientPendingsCapacitacion" placeholder="Lista de tareas del cliente..."></textarea>

        <label>Pendientes NCQ</label>
        <textarea id="ncqPendingsCapacitacion"
          placeholder="Notas sobre el aprendizaje o dudas del cliente..."></textarea>

        <label>Link de la capacitación</label>
        <input id="capacitacionLink" placeholder="https://...">
      </div>

      <div id="sectionPuestaEnMarcha" class="hidden">
        <hr class="hr">
        <label>Trabajo Realizado</label>
        <textarea id="workDonePuestaEnMarcha" placeholder="Describa el trabajo realizado..."></textarea>

        <label>Pendientes Cliente</label>
        <textarea id="clientPendingsPuestaEnMarcha" placeholder="Lista de tareas del cliente..."></textarea>

        <label>Pendientes NCQ</label>
        <textarea id="ncqPendingsPuestaEnMarcha" placeholder="Lista de tareas nuestras..."></textarea>
      </div>

      <div class="btns">
        <button class="primary" id="btnCopy" type="button">Copiar Correo</button>
        <button class="pdf-btn" id="btnPDF" type="button">Exportar a PDF</button>
      </div>

    </div>

    <div class="panel">
      <h1>Vista previa</h1>
      <iframe id="preview" class="preview"></iframe>
    </div>

  </div>

  <script src="app.js" defer></script>
</body>

</html>
