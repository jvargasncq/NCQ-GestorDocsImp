<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Qupos - Coordinación</title>
  <link rel="icon" href="https://www.qupos.com/assets/qupos-logo-O7Yzz17d.png" type="image/png" />
  <link rel="preload"
    href="https://nlxfcqyqzaigdohkvpmf.supabase.co/storage/v1/object/public/avatars/Logos%20adicionales/lite.png"
    as="image" />
  <link rel="preload" href="https://www.qupos.com/assets/qupos-logo-O7Yzz17d.png" as="image" />
  <link rel="preload"
    href="https://nlxfcqyqzaigdohkvpmf.supabase.co/storage/v1/object/public/avatars/Logos%20adicionales/erp.png"
    as="image" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="index.html">
        <img src="https://www.qupos.com/assets/qupos-logo-O7Yzz17d.png" alt="Qupos" />
        <div class="brand-copy">
          <div class="t">Centro de trabajo Implantaciones</div>
          <div class="s">Accesos internos</div>
        </div>
      </a>
      <div class="topbar-main">
        <div class="navlinks" aria-label="Navegación principal">
          <a class="navlink" href="index.html">Minutas</a>
          <a class="navlink active" href="coordinacion.html">Coordinación</a>
          <a class="navlink" href="guia_hubspot.html">Guía</a>
        </div>
      </div>
    </div>
  </div>

  <div class="wrap">

    <div class="panel">

      <div class="tabs" role="tablist" aria-label="Tipos de correo">
        <button class="tab active" id="tabOnboarding" type="button" data-tab="onboarding">Onboarding</button>
        <button class="tab" id="tabPlanDeTrabajo" type="button" data-tab="planDeTrabajo">Plan de Trabajo</button>
      </div>

      <div class="field-group">
        <label>Asunto</label>
        <div style="display: flex; align-items: center; gap: 8px; border: 1px solid var(--border); border-radius: 12px; background: rgba(255, 255, 255, 0.4); padding: 10px 14px; min-height: 42px; backdrop-filter: blur(4px);">
          <div id="subject" style="font-weight: bold; font-size: 13px; color: var(--text); flex: 1;">
            Minuta Razón Comercial Onboarding
          </div>
          <button type="button" id="btnCopySubject" class="icon-btn" title="Copiar Asunto">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3" />
            </svg>
          </button>
        </div>
      </div>

      <hr class="hr">

      <div id="rowDateImplanter" class="row">
        <div id="divInstallDate" class="field-group">
          <label>Fecha</label>
          <input type="date" id="installDate">
        </div>
        <div class="field-group">
          <label>Coordinador NCQ</label>
          <select id="implanterNCQ">
            <!-- Carga dinámica desde JS -->
          </select>
        </div>
      </div>

      <div class="row">
        <div id="divClientName" class="field-group">
          <label>Razón comercial</label>
          <input id="clientName" placeholder="Razón Comercial">
        </div>
        <div id="divClientContact" class="field-group">
          <label>Cliente a cargo</label>
          <input id="clientContact" placeholder="Nombre de la persona en la empresa">
        </div>
      </div>

      <div class="field-group">
        <label>Licencia Qupos</label>
        <select id="quposVersion">
          <option value="Lite">Lite</option>
          <option value="Estandar" selected>Estandar</option>
          <option value="ERP">ERP</option>
        </select>
      </div>

      <!-- ONBOARDING SECTION -->
      <div id="sectionOnboarding" class="form-section">
        <hr class="hr">
        <div class="field-group">
          <label>Plantilla de Correo Onboarding</label>
          <select id="onboardingTemplate">
            <!-- Carga dinámica desde JS -->
          </select>
        </div>
        <div id="onboardingAlert" class="hidden" style="margin-top: 4px; padding: 12px 14px; border-radius: 10px; background-color: rgba(242, 114, 33, 0.08); border-left: 4px solid var(--qupos-dark); font-size: 13.5px; line-height: 1.5; color: #b14800; font-weight: 600;">
          <!-- Se carga dinámicamente desde JS -->
        </div>
        <div id="divSurveyLink" class="hidden field-group">
          <label>Link de Encuesta de Satisfacción</label>
          <input type="text" id="surveyLink" placeholder="https://encuesta.qupos.com/..." value="https://encuesta.qupos.com">
        </div>
      </div>

      <!-- PLAN DE TRABAJO SECTION -->
      <div id="sectionPlanDeTrabajo" class="hidden form-section">
        <hr class="hr">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
          <h3 style="margin:0; font-size:16px; font-weight: 600; color: var(--text-color);">Plan de Trabajo</h3>
          <div style="display:flex; gap: 8px;">
            <button type="button" id="btnAddSession" class="btn btn-secondary" style="padding: 6px 12px; font-size: 13px; cursor: pointer; border-radius: 6px;">+ Agregar Fila</button>
          </div>
        </div>
        <div id="sessionRowsContainer">
          <!-- Dynamic row cards will be generated here -->
        </div>
      </div>

      <div class="btns">
        <button class="primary" id="btnCopy" type="button">Copiar Correo</button>
        <button class="pdf-btn" id="btnPDF" type="button">Exportar a PDF</button>
      </div>

    </div>

    <div class="panel">
      <h1>Vista previa</h1>
      <iframe id="preview" class="preview"></iframe>
    </div>

  </div>

  <script src="coordinacion.js" defer></script>
</body>

</html>
